<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f8f6">
    <title>Iniciar sesión | DRBOT</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
    <header class="topbar">
        <a class="brand" href="../index.html" aria-label="DRBOT, mi carpeta de salud"><img src="../assets/images/drbot_logo_transparente.png" alt="DRBOT"></a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Modo oscuro</span></button>
    </header>
    <main class="content auth-content">
        <section class="auth-card">
            <span class="auth-mark" aria-hidden="true">+</span>
            <span class="eyebrow">PORTAL DE PACIENTES</span>
            <h1>Inicia sesión</h1>
            <p class="auth-description">Accede a tu información de salud con tu cuenta de DRBOT.</p>
            <form class="auth-form" id="auth-form">
                <label for="email">Correo electrónico</label>
                <input id="email" name="email" type="email" autocomplete="username" required>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button id="submit-button" type="submit">Iniciar sesión</button>
                <p class="auth-error" id="auth-error" role="alert" hidden></p>
            </form>
            <aside class="mobile-registration-note">
                <strong>¿Aún no tienes cuenta?</strong>
                <p>Créala desde la aplicación móvil DRBOT. Esta web es un portal informativo para consultar tus datos de salud.</p>
            </aside>
        </section>
    </main>
    <footer>
        <a href="../index.html">Volver a mi carpeta</a>
        <span>DRBOT · Toda tu salud a tu alcance</span>
    </footer>
    
    <script src="../js/theme.js"></script>
    <script type="module" src="../js/auth-page.js"></script>
    <script src="../js/home-page.js"></script>
</body>
</html>
